org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP's JdkImageTransform (jlink) fails when the JDK path contains a space,
# which "/Applications/Android Studio.app/..." does. Point at a space-free
# symlink to the same JBR instead — see ~/development/jbr.
org.gradle.java.home=/Users/mac/development/jbr
