name: dentex
description: "Dentex - dental supply distributor management app."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0

  # State management & routing
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^14.6.1

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI / utils
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  file_picker: ^8.1.4
  cryptography: ^2.7.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: 2.15.3
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
